# FLASHARB scanner configuration.
#
# Copy to `config.toml` and fill in. RPC URLs may use ${ENV_VAR} placeholders,
# resolved from the environment at startup (see `.env`).
#
# Addresses below are real mainnet deployments as of 2024. Verify before use.

min_profit_usd = 25.0      # ignore opportunities below this net profit
gas_limit = 450000         # expected gas for a full flash-loan arb tx
poll_interval_ms = 3000    # delay between scan cycles

# ---------------------------------------------------------------------------
# BASE
# ---------------------------------------------------------------------------
[[chains]]
name = "base"
chain_id = 8453
rpc_url = "${BASE_RPC_URL}"
aave_addresses_provider = "0xe20fCBdBfFC4Dd138cE8b2E6FBb6CB49777ad64D"
flashloan_premium_bps = 5
gas_price_gwei = 0.02
native_usd = 3500.0
# executor = "0x...your deployed FlashArbExecutor..."

  [[chains.dexes]]
  name = "uniswap_v3"
  kind = "uniswap_v3"
  router = "0x2626664c2603336E57B271c5C0b26F421741e481"  # Uniswap V3 SwapRouter02
  quoter = "0x3d4e44Eb1374240CE5F1B871ab261CD16335B76a"  # QuoterV2
  fee = 500

  [[chains.dexes]]
  name = "aerodrome"
  kind = "uniswap_v2"
  router = "0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43"  # Aerodrome router (V2-style)
  quoter = "0xcF77a3Ba9A5CA399B7c97c74d54e5b1Beb874E43"

  [[chains.pairs]]
  trade_size = 50000.0
    [chains.pairs.base]
    symbol = "USDC"
    address = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    decimals = 6
    [chains.pairs.quote]
    symbol = "WETH"
    address = "0x4200000000000000000000000000000000000006"
    decimals = 18

